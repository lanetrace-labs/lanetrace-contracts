name: Slot storage semantics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lanetrace-labs/lanetrace-contracts
          path: lanetrace-contracts
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path lanetrace-contracts/Cargo.toml
